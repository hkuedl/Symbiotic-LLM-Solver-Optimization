[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# The mathematical implementation uses conventional l (line) and I (uncertainty).
# Retain original local assignments to keep the computational refactor minimal.
ignore = ["E741", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
